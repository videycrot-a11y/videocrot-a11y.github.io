<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vudol</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --line: #e2e8f0;
      --btn: #111827;
      --btnText: #ffffff;
      --btnHover: #000000;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text); background: var(--bg); line-height: 1.45; overflow-x: hidden;
    }

    .appbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      width: 100%; max-width: 1200px; margin-inline: auto;
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    }

    .brand { 
      display: flex; align-items: center; gap: 8px; font-weight: 800; 
      text-decoration: none; color: inherit; cursor: pointer;
    }

    .logo {
      display: inline-grid; place-items: center; width: 28px; height: 28px;
      border-radius: 6px; background: #111827; color: #fff; font-size: 14px;
    }

    .spacer { flex: 1; }

    .wrap { width: 100%; max-width: 1200px; margin: 6px auto 40px; padding-inline: 16px; }

    .player-shell { display: grid; place-items: center; margin-top: 20px; }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 420px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
    }

    .phone video { width: 100%; height: 100%; object-fit: cover; }

    .video-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      background: rgba(0,0,0,0.01);
      cursor: pointer;
    }

    .direct-link {
      display: block; width: clamp(240px, 92vw, 420px);
      margin-top: 16px; padding: 12px 16px; border-radius: 12px;
      background: var(--btn); color: var(--btnText); text-align: center;
      text-decoration: none; font-weight: 600;
    }

    .direct-link:hover { background: var(--btnHover); }

    @media (min-width: 1024px) {
      .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px) minmax(0, 1fr); }
      .player-shell { grid-column: 2; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="bar-inner">
      <a class="brand" href="https://crummyneedle.com/hjqzamya?key=5b2ebc879d26c5fdc3cfc191cfe9aaba" target="_blank" rel="noopener noreferrer">
        <span class="logo">V</span>
        <span>RUDALSAEPUDIN</span>
      </a>
      <div class="spacer"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="player-shell">
      <div class="phone">
        <div id="videoOverlay" class="video-overlay"></div>
        <video id="myVideo" controls playsinline autoplay muted preload="metadata" src="VID-20260717-WA0040.mp4"></video>
      </div>

      <a class="direct-link" href="https://crummyneedle.com/hjqzamya?key=5b2ebc879d26c5fdc3cfc191cfe9aaba" target="_blank" rel="noopener noreferrer">
        BERIKUTNYA
      </a>
    </section>
  </main>

  <!-- POPUNDER SCRIPT -->
  <script src="https://crummyneedle.com/d1/01/ca/d101ca05eb20975a6b8c6a27b1417b5f.js"></script>

  <!-- SCRIPT IKLAN OTOMATIS (5 DETIK) -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var overlay = document.getElementById("videoOverlay");
      var video = document.getElementById("myVideo");
      var smartlinkUrl = "https://crummyneedle.com/hjqzamya?key=5b2ebc879d26c5fdc3cfc191cfe9aaba";

      // 1. IKLAN OTOMATIS SETELAH 5 DETIK TANPA KLIK
      setTimeout(function() {
        window.open(smartlinkUrl, '_blank');
      }, 5000); // 5000ms = 5 detik

      // 2. KLIK MANUAL VIDEO (Tetap Aktif)
      overlay.addEventListener("click", function () {
        window.open(smartlinkUrl, '_blank');
        overlay.style.display = "none";
        video.muted = false;
        video.play();
      });
    });
  </script>
</body>
</html>
