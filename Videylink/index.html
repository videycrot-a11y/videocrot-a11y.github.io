<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>videy - Free and simple video hosting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #0d1322;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #0d1322;
      text-decoration: none;
    }

    .nav-btn {
      background-color: #0d1322;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .nav-btn:hover {
      background-color: #1e293b;
    }

    /* Main Section */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px 20px 80px 20px;
    }

    /* Pemutar Video */
    .video-wrapper {
      width: 100%;
      max-width: 800px;
      margin-bottom: 24px;
    }

    video {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      background-color: #000;
    }

    p.subtitle {
      font-size: 18px;
      color: #475569;
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* Action Button */
    .upload-btn {
      background-color: #0d1322;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(13, 19, 34, 0.15);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .upload-btn:hover {
      background-color: #1e293b;
      transform: translateY(-1px);
    }

    #file-input {
      display: none;
    }

    /* Responsive Mobile */
    @media (max-width: 640px) {
      header {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">videy</a>
    <button class="nav-btn" onclick="document.getElementById('file-input').click()">Upload</button>
  </header>

  <main>
    <!-- Pemutar Video R2 -->
    <div class="video-wrapper">
      <video controls autoplay muted playsinline>
        <source src="https://pub-xxx.r2.dev/D5QERJl91.mp4" type="video/mp4">
        Browser Anda tidak mendukung pemutar video.
      </video>
    </div>

    <p class="subtitle">Free and simple video hosting.</p>
    
    <!-- Input File Tersembunyi -->
    <input type="file" id="file-input" accept="video/*" onchange="handleUpload(this.files)">
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">Upload Video Lain</button>
  </main>

  <script>
    function handleUpload(files) {
      if (files.length > 0) {
        alert("File terpilih: " + files[0].name + "\n\nUntuk mengunggah video baru, unggah file tersebut secara manual ke dashboard Cloudflare R2 Anda.");
      }
    }
  </script>

</body>
</html>
